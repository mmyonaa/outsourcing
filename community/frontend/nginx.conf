# www 도메인을 메인 도메인으로 리디렉션
server {
    listen 80;
    server_name www.bktheater.com;
    return 301 $scheme://bktheater.com$request_uri;
}

# 메인 도메인 설정
server {
    listen 80;
    server_name bktheater.com localhost;

    # 옛 URL(쿼리 파라미터 형식) → 새 경로 형식 301 리디렉션.
    # 옛/새 URL의 id가 동일하므로 $arg_id(쿼리스트링 id)를 그대로 경로에 붙인다.
    # (실서버 HTTPS(443) server 블록에도 동일하게 추가해야 적용됨)
    location = /performance/detail      { return 301 /performance/$arg_id; }
    location = /performance/next/detail { return 301 /performance/next/$arg_id; }
    location = /notice/detail           { return 301 /notice/$arg_id; }
    location = /news/detail             { return 301 /news/$arg_id; }

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
