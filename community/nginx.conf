# 실서버 nginx 설정의 거울(mirror).
#
# 정본은 EC2 의 /etc/nginx/conf.d/myapp.conf 다. 이 파일을 복사해 배포하지 않는다 —
# 여기는 버전 관리와 인스턴스 유실 시 복구를 위한 사본이다. 설정을 바꿀 때는 서버 파일을
# 고치고(nginx -t → systemctl reload nginx) 그 결과를 여기에 옮겨 적는다.
#
# nginx.conf 가 include /etc/nginx/conf.d/*.conf 를 하므로 서버에서 실제로 로드되는
# conf.d 파일은 myapp.conf 하나다(.save/.bak 류는 *.conf 가 아니라 무시된다).
#
# 서버와 어긋나지 않았는지 확인 — 주석·빈 줄을 뺀 지시어만 비교한다:
#   diff <(grep -vE '^[[:space:]]*(#|$)' community/nginx.conf) \
#        <(ssh -i community/bktheater.pem ec2-user@13.125.101.232 \
#            'sudo cat /etc/nginx/conf.d/myapp.conf' | grep -vE '^[[:space:]]*(#|$)')

# www 도메인을 메인 도메인으로 리디렉션
server {
    server_name www.bktheater.com;
    return 301 $scheme://bktheater.com$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bktheater.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bktheater.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    server_name bktheater.com;

    # 옛 URL(쿼리 파라미터 형식) → 새 경로 형식 301 리디렉션 (id 동일)
    location = /performance/detail      { return 301 /performance/$arg_id; }
    location = /performance/next/detail { return 301 /performance/next/$arg_id; }
    location = /notice/detail           { return 301 /notice/$arg_id; }
    location = /news/detail             { return 301 /news/$arg_id; }

    # 옛 사이트의 숫자 ID 주소(/notice/1 등). 현재 글/공연 ID 는 UUID 라 대응하는 글이 없다.
    # 그대로 두면 SPA 폴백이 홈 HTML 을 200 으로 돌려줘 검색엔진이 홈 사본(soft 404)으로
    # 쌓는다 — 영구 삭제(410)로 끊어 색인에서 빠지게 한다.
    # 목록 페이지네이션은 ?pageNo= 쿼리를 쓰므로 정상 URL 과 겹치지 않는다.
    location ~ ^/(notice|news|performance(/next)?)/[0-9]+$ { return 410; }

    # /api 요청 → Koa 3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 그 외 요청 → Vue
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bktheater.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bktheater.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}




server {
    if ($host = bktheater.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name bktheater.com;
    return 404; # managed by Certbot


}
server {
    if ($host = www.bktheater.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.bktheater.com;
    return 404; # managed by Certbot


}
